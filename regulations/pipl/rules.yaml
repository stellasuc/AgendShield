rules:
  - rule_id: PIPL_PROCESSING_BASIS_001
    normalized_concept: LAWFUL_BASIS
    regulation_sources: [{requirement_id: PIPL_PROCESSING_BASIS}]
    lifecycle_stages: [EXTERNAL_TRANSFER, RESPONSE_GENERATED, MEMORY_WRITE]
    dependencies: [object.contains_personal_data, event.has_lawful_basis]
    predicate: {type: deterministic, handler: require_validated_lawful_basis}
    applicability:
      - {variable: object.contains_personal_data, operator: EQ, value: true}
    requirements:
      - {variable: event.has_lawful_basis, operator: EQ, value: true}
    severity: HIGH
    interventions: [REQUIRE_APPROVAL]
    description: Engineering control requiring validated processing-basis metadata.

  - rule_id: PIPL_PURPOSE_LIMITATION_001
    normalized_concept: PURPOSE_LIMITATION
    regulation_sources: [{requirement_id: PIPL_PURPOSE_AND_MINIMUM_NECESSARY}]
    lifecycle_stages: [EXTERNAL_TRANSFER, RESPONSE_GENERATED, MEMORY_WRITE]
    dependencies: [object.contains_personal_data, event.purpose_compatible]
    predicate: {type: deterministic, handler: require_compatible_declared_purpose}
    applicability:
      - {variable: object.contains_personal_data, operator: EQ, value: true}
    requirements:
      - {variable: event.purpose_compatible, operator: EQ, value: true}
    severity: HIGH
    interventions: [REPLAN, BLOCK]
    description: Engineering control for explicitly declared purpose compatibility.

  - rule_id: PIPL_DATA_MINIMIZATION_001
    normalized_concept: DATA_MINIMIZATION
    regulation_sources: [{requirement_id: PIPL_PURPOSE_AND_MINIMUM_NECESSARY}]
    lifecycle_stages: [EXTERNAL_TRANSFER]
    dependencies: [object.contains_personal_data, event.recipient_type, event.is_minimized]
    predicate: {type: deterministic, handler: excessive_personal_data_for_declared_purpose}
    applicability:
      - {variable: object.contains_personal_data, operator: EQ, value: true}
      - {variable: event.recipient_type, operator: EQ, value: external}
    requirements:
      - {variable: event.is_minimized, operator: EQ, value: true}
    severity: HIGH
    interventions: [AGGREGATE, REDACT, BLOCK]
    repair_strategy: AGGREGATE
    description: Aggregate or redact unnecessary raw personal information before external transfer.

  - rule_id: PIPL_RETENTION_001
    normalized_concept: STORAGE_LIMITATION
    regulation_sources: [{requirement_id: PIPL_RETENTION}]
    lifecycle_stages: [MEMORY_WRITE, LOG_WRITE]
    dependencies: [object.contains_personal_data, event.retention_bounded]
    predicate: {type: deterministic, handler: require_bounded_retention}
    applicability:
      - {variable: object.contains_personal_data, operator: EQ, value: true}
    requirements:
      - {variable: event.retention_bounded, operator: EQ, value: true}
    severity: HIGH
    interventions: [PREVENT_MEMORY_WRITE, BLOCK]
    description: Prevent persistent storage without bounded retention metadata.

  - rule_id: PIPL_THIRD_PARTY_PROVISION_001
    regulation_sources: [{requirement_id: PIPL_PROVISION_TO_HANDLER}]
    lifecycle_stages: [EXTERNAL_TRANSFER]
    dependencies: [object.contains_personal_data, event.recipient_type, event.recipient_notified, authorization.separate_consent]
    predicate: {type: deterministic, handler: require_notice_and_separate_consent_for_other_handler}
    applicability:
      - {variable: object.contains_personal_data, operator: EQ, value: true}
      - {variable: event.recipient_type, operator: EQ, value: external_handler}
    requirements:
      - {variable: event.recipient_notified, operator: EQ, value: true}
      - {variable: authorization.separate_consent, operator: EQ, value: true}
    severity: CRITICAL
    interventions: [REQUIRE_CONSENT, BLOCK]
    description: Require notice and scoped separate consent for provision to another handler.

  - rule_id: PIPL_SENSITIVE_PROCESSING_001
    regulation_sources: [{requirement_id: PIPL_SENSITIVE_PROCESSING}]
    lifecycle_stages: [EXTERNAL_TRANSFER, RESPONSE_GENERATED, MEMORY_WRITE]
    dependencies: [object.attributes.pipl_sensitive_candidate, event.specific_purpose, event.strictly_necessary, event.protective_measures_confirmed]
    predicate: {type: deterministic, handler: require_sensitive_purpose_necessity_and_protection}
    applicability:
      - {variable: object.attributes.pipl_sensitive_candidate, operator: EQ, value: true}
    requirements:
      - {variable: event.specific_purpose, operator: EQ, value: true}
      - {variable: event.strictly_necessary, operator: EQ, value: true}
      - {variable: event.protective_measures_confirmed, operator: EQ, value: true}
    severity: CRITICAL
    interventions: [REQUIRE_APPROVAL, BLOCK]
    description: Require confirmation of purpose, necessity, and protection for sensitive candidates.

  - rule_id: PIPL_SENSITIVE_SEPARATE_CONSENT_001
    regulation_sources: [{requirement_id: PIPL_SENSITIVE_SEPARATE_CONSENT}]
    lifecycle_stages: [EXTERNAL_TRANSFER, RESPONSE_GENERATED, MEMORY_WRITE]
    dependencies: [object.attributes.pipl_sensitive_candidate, authorization.separate_consent]
    predicate: {type: deterministic, handler: require_scoped_separate_consent_for_sensitive_candidate}
    applicability:
      - {variable: object.attributes.pipl_sensitive_candidate, operator: EQ, value: true}
    requirements:
      - {variable: authorization.separate_consent, operator: EQ, value: true}
    severity: CRITICAL
    interventions: [REQUIRE_CONSENT, BLOCK]
    description: Require scoped separate consent for sensitive-information candidates.

  - rule_id: PIPL_CROSS_BORDER_MECHANISM_001
    normalized_concept: CROSS_BORDER_MECHANISM
    regulation_sources: [{requirement_id: PIPL_CROSS_BORDER}]
    lifecycle_stages: [EXTERNAL_TRANSFER]
    dependencies: [object.contains_personal_data, event.cross_border, event.cross_border_mechanism_confirmed]
    predicate: {type: deterministic, handler: require_confirmed_cross_border_mechanism}
    applicability:
      - {variable: object.contains_personal_data, operator: EQ, value: true}
      - {variable: event.cross_border, operator: EQ, value: true}
    requirements:
      - {variable: event.cross_border_mechanism_confirmed, operator: EQ, value: true}
    severity: CRITICAL
    interventions: [REQUIRE_APPROVAL, BLOCK]
    description: Require external validation of a cross-border route or condition.

  - rule_id: PIPL_CROSS_BORDER_CONSENT_001
    normalized_concept: CROSS_BORDER_SEPARATE_CONSENT
    regulation_sources: [{requirement_id: PIPL_CROSS_BORDER}]
    lifecycle_stages: [EXTERNAL_TRANSFER]
    dependencies: [object.contains_personal_data, event.cross_border, event.recipient_notified, authorization.separate_consent]
    predicate: {type: deterministic, handler: require_cross_border_notice_and_separate_consent}
    applicability:
      - {variable: object.contains_personal_data, operator: EQ, value: true}
      - {variable: event.cross_border, operator: EQ, value: true}
    requirements:
      - {variable: event.recipient_notified, operator: EQ, value: true}
      - {variable: authorization.separate_consent, operator: EQ, value: true}
    severity: CRITICAL
    interventions: [REQUIRE_CONSENT, BLOCK]
    description: Require cross-border notice and scoped separate consent evidence.
